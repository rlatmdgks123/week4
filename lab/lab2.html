<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4주차 실습 2</title>
</head>
<body>
  <!--
  실습 2 · 기본

  문제: 이번 학기 시간표를 표로 만드세요. caption으로 표 제목을 달고, 요일 머리글에는 scope="col"을, 교시 머리글에는 scope="row"를 쓰세요.
  힌트: caption은 table 안 첫 줄에 옵니다. 세로줄의 머리글이 col, 가로줄의 머리글이 row입니다.
  꼭 들어가야 하는 것: <table  <caption>  scope="col"  scope="row"  <td>
  -->
  <table border="1">
  <caption>김승한의 2학기 시간표</caption>
  <thead>
    <tr>
      <th scope="col">교시</th>
      <th scope="col">월</th>
      <th scope="col">화</th>
      <th scope="col">목</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">7~8</th>
      <td></td>
      <td>웹프로그래밍</td>
    </tr>
    <tr>
      <th scope="row">9~10</th>
      <td>자료구조</td>
      <td></td>
    </tr>
  </tbody>
</table>
</body>
</html>
